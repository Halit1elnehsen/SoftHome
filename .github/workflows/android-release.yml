name: Signed Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching android/app/build.gradle (for example v1.4.0)'
        required: true
        default: v1.4.0

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PYTHON'
          import os,re,pathlib
          tag=os.environ['RELEASE_TAG']
          version=re.search(r'versionName "([^"]+)"',pathlib.Path('android/app/build.gradle').read_text()).group(1)
          if not re.fullmatch(r'v\d+\.\d+\.\d+',tag) or tag!='v'+version:
              raise SystemExit('Release tag must match Android versionName')
          PYTHON
      - name: Test and bundle frontend
        run: |
          npm ci --prefix frontend
          npm ci --prefix tests/frontend
          npm ci --prefix tests/postgres
          npm test --prefix tests/frontend
          npm test --prefix tests/postgres
          npm run build --prefix frontend
      - name: Prepare Android platform
        run: sdkmanager 'platforms;android-34' 'build-tools;35.0.0'
      - name: Decode private signing key
        env:
          SOFTHOME_KEYSTORE_BASE64: ${{ secrets.SOFTHOME_KEYSTORE_BASE64 }}
        run: |
          test -n "$SOFTHOME_KEYSTORE_BASE64" || { echo 'Configure the four signing Secrets from docs/android-release.md first.'; exit 1; }
          umask 077
          printf '%s' "$SOFTHOME_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/softhome-release.keystore"
      - name: Build signed release and run Android lint
        working-directory: android
        env:
          SOFTHOME_KEYSTORE_PATH: ${{ runner.temp }}/softhome-release.keystore
          SOFTHOME_KEYSTORE_PASSWORD: ${{ secrets.SOFTHOME_KEYSTORE_PASSWORD }}
          SOFTHOME_KEY_ALIAS: ${{ secrets.SOFTHOME_KEY_ALIAS }}
          SOFTHOME_KEY_PASSWORD: ${{ secrets.SOFTHOME_KEY_PASSWORD }}
        run: bash ./gradlew :app:assembleRelease :app:lintRelease --no-daemon
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/SoftHome.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release-output/SoftHome.apk
          (cd release-output && sha256sum SoftHome.apk > SHA256SUMS.txt)
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true || { echo 'This release is already published; use a new Android version and tag.'; exit 1; }
            gh release upload "$RELEASE_TAG" release-output/SoftHome.apk release-output/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --target "$GITHUB_SHA" --title "SoftHome $RELEASE_TAG" --notes-file docs/release-notes.md
          else
            gh release create "$RELEASE_TAG" release-output/SoftHome.apk release-output/SHA256SUMS.txt --target "$GITHUB_SHA" --title "SoftHome $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/softhome-release.keystore"
