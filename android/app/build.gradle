plugins {
    id 'com.android.application'
}

android {
    namespace 'com.softhome.app'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.softhome.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        def serviceUrl = (project.findProperty('softHomeUrl') ?: '').toString()
        if (serviceUrl && !serviceUrl.startsWith('https://')) {
            throw new GradleException('softHomeUrl must use HTTPS')
        }
        buildConfigField 'String', 'SOFT_HOME_URL', '"' + serviceUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
}
