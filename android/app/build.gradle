plugins {
    id 'com.android.application'
}

def signingValues = [
    path: System.getenv('SOFTHOME_KEYSTORE_PATH'),
    storePassword: System.getenv('SOFTHOME_KEYSTORE_PASSWORD'),
    alias: System.getenv('SOFTHOME_KEY_ALIAS'),
    keyPassword: System.getenv('SOFTHOME_KEY_PASSWORD')
]
def hasReleaseSigning = signingValues.values().every { it }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !hasReleaseSigning) {
    throw new GradleException('Release signing is required. Set SOFTHOME_KEYSTORE_PATH, SOFTHOME_KEYSTORE_PASSWORD, SOFTHOME_KEY_ALIAS and SOFTHOME_KEY_PASSWORD. See docs/android-release.md.')
}

android {
    namespace 'com.softhome.app'
    compileSdk 34

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId "com.softhome.app"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.4.0"
        def serviceUrl = (project.findProperty('softHomeUrl') ?: '').toString()
        if (serviceUrl && !serviceUrl.startsWith('https://')) {
            throw new GradleException('softHomeUrl must use HTTPS')
        }
        buildConfigField 'String', 'SOFT_HOME_URL', '"' + serviceUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.0'
    implementation 'com.google.android.material:material:1.12.0'
}
